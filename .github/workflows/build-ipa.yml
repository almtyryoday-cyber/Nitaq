name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create iOS project
        run: |
          mkdir -p ios/Nitaq/web ios/Nitaq/Assets.xcassets/AppIcon.appiconset
          cp index.html manifest.json icon-*.png ios/Nitaq/web/
          cp icon-1024.png ios/Nitaq/Assets.xcassets/AppIcon.appiconset/
          echo '{"info":{"author":"xcode","version":1}}' > ios/Nitaq/Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > ios/Nitaq/Assets.xcassets/AppIcon.appiconset/Contents.json

          cat > ios/project.yml <<'EOF'
          name: Nitaq
          options:
            bundleIdPrefix: com.nitaq
            deploymentTarget:
              iOS: "15.0"
          targets:
            Nitaq:
              type: application
              platform: iOS
              sources:
                - path: Nitaq
                  excludes:
                    - "web/**"
                - path: Nitaq/web
                  type: folder
                  buildPhase: resources
              info:
                path: Nitaq/Info.plist
                properties:
                  CFBundleDisplayName: "نطاق"
                  CFBundleShortVersionString: "2.0"
                  CFBundleVersion: "2"
                  UILaunchScreen: {}
                  UIStatusBarStyle: UIStatusBarStyleLightContent
                  UIViewControllerBasedStatusBarAppearance: true
                  UIRequiresFullScreen: true
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
                  ITSAppUsesNonExemptEncryption: false
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.nitaq.speed
                  PRODUCT_NAME: Nitaq
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

          cat > ios/Nitaq/AppDelegate.swift <<'EOF'
          import UIKit
          import WebKit

          @main
          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let w = UIWindow(frame: UIScreen.main.bounds)
                  w.rootViewController = WebViewController()
                  w.backgroundColor = .black
                  w.makeKeyAndVisible()
                  window = w
                  return true
              }
          }

          final class WebViewController: UIViewController, WKUIDelegate, WKNavigationDelegate, WKScriptMessageHandler {
              private var webView: WKWebView!

              // Web icon id -> Apple SF Symbol names (first one available is used)
              private static let symbols: [String: [String]] = [
                  "speedometer": ["gauge.with.dots.needle.67percent", "speedometer"],
                  "clock-arrow": ["clock.arrow.circlepath"],
                  "chart-pie": ["chart.pie.fill"],
                  "gear": ["gearshape.fill"],
                  "arrow-down": ["arrow.down"],
                  "arrow-up": ["arrow.up"],
                  "bolt": ["bolt.fill"],
                  "wave": ["waveform.path.ecg"],
                  "globe": ["globe"],
                  "server": ["server.rack"],
                  "wifi": ["wifi"],
                  "antenna": ["antenna.radiowaves.left.and.right"],
                  "play": ["play.fill"],
                  "repeat": ["arrow.clockwise"],
                  "share": ["square.and.arrow.up"],
                  "check": ["checkmark"],
                  "check-circle": ["checkmark.circle.fill"],
                  "warn": ["exclamationmark.triangle.fill"],
                  "chevron": ["chevron.right"],
                  "trash": ["trash.fill"],
                  "moon": ["moon.fill"],
                  "paint": ["paintpalette.fill"],
                  "gauge-unit": ["slider.horizontal.3"],
                  "timer": ["timer"],
                  "link": ["link"],
                  "info": ["info.circle.fill"],
                  "sim": ["simcard.fill"],
                  "calendar": ["calendar"],
                  "infinity": ["infinity"],
                  "plus": ["plus"],
                  "msg": ["message.fill"],
                  "music": ["music.note"],
                  "tv": ["play.rectangle.fill"],
                  "film": ["film.fill"],
                  "video": ["video.fill"],
                  "game": ["gamecontroller.fill"],
                  "broadcast": ["dot.radiowaves.left.and.right"],
                  "download-box": ["square.and.arrow.down.fill"]
              ]

              private static func symbolsJSON() -> String {
                  let cfg = UIImage.SymbolConfiguration(pointSize: 60, weight: .semibold)
                  var out: [String: String] = [:]
                  for (key, names) in symbols {
                      guard let img = names.lazy.compactMap({ UIImage(systemName: $0, withConfiguration: cfg) }).first?
                              .withTintColor(.black, renderingMode: .alwaysOriginal) else { continue }
                      let png = UIGraphicsImageRenderer(size: img.size).pngData { _ in img.draw(at: .zero) }
                      out[key] = "data:image/png;base64," + png.base64EncodedString()
                  }
                  guard let data = try? JSONSerialization.data(withJSONObject: out),
                        let s = String(data: data, encoding: .utf8) else { return "{}" }
                  return s
              }

              override var preferredStatusBarStyle: UIStatusBarStyle {
                  traitCollection.userInterfaceStyle == .light ? .darkContent : .lightContent
              }

              override func loadView() {
                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()
                  config.allowsInlineMediaPlayback = true
                  let js = "window.__SF=" + Self.symbolsJSON() + ";window.__NATIVE=true;"
                  config.userContentController.addUserScript(
                      WKUserScript(source: js, injectionTime: .atDocumentStart, forMainFrameOnly: true))
                  config.userContentController.add(self, name: "theme")
                  webView = WKWebView(frame: .zero, configuration: config)
                  webView.uiDelegate = self
                  webView.navigationDelegate = self
                  webView.isOpaque = false
                  webView.backgroundColor = .systemBackground
                  webView.scrollView.backgroundColor = .systemBackground
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  view = webView
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  guard let dir = Bundle.main.url(forResource: "web", withExtension: nil) else { return }
                  webView.loadFileURL(dir.appendingPathComponent("index.html"), allowingReadAccessTo: dir)
              }

              // Links clicked in the main page open in Safari (Speedtest's own frame keeps working)
              func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction,
                           decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                  if let url = navigationAction.request.url,
                     navigationAction.navigationType == .linkActivated,
                     navigationAction.targetFrame?.isMainFrame ?? true,
                     url.scheme == "http" || url.scheme == "https" {
                      UIApplication.shared.open(url); decisionHandler(.cancel); return
                  }
                  decisionHandler(.allow)
              }

              // web page tells us which theme it uses -> status bar follows
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let t = message.body as? String else { return }
                  overrideUserInterfaceStyle = (t == "light") ? .light : .dark
                  setNeedsStatusBarAppearanceUpdate()
              }

              // target="_blank" links
              func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration,
                           for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                  if let url = navigationAction.request.url { UIApplication.shared.open(url) }
                  return nil
              }

              func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String,
                           initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                  let a = UIAlertController(title: nil, message: message, preferredStyle: .alert)
                  a.addAction(UIAlertAction(title: "تم", style: .default) { _ in completionHandler() })
                  present(a, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String,
                           initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  let a = UIAlertController(title: nil, message: message, preferredStyle: .alert)
                  a.addAction(UIAlertAction(title: "إلغاء", style: .cancel) { _ in completionHandler(false) })
                  a.addAction(UIAlertAction(title: "نعم", style: .destructive) { _ in completionHandler(true) })
                  present(a, animated: true)
              }
          }
          EOF

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Nitaq.xcodeproj -target Nitaq -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Nitaq.app Payload/
          zip -qry ../Nitaq.ipa Payload
          ls -lh ../Nitaq.ipa

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Nitaq.ipa --title "نطاق — آخر نسخة" --notes "ثبّته عن طريق Sideloadly أو AltStore"
